name: security-check

env:
  PYYAML_FORCE_LIBYAML: '0'

on:
  pull_request:
  workflow_dispatch:
    inputs:
      severity:
        description: "Minimum severity to report (low|medium|high)"
        required: false
        default: "medium"
        type: choice
        options: [low, medium, high]
      confidence:
        description: "Minimum confidence to report (low|medium|high)"
        required: false
        default: "medium"
        type: choice
        options: [low, medium, high]
      use_baseline:
        description: "Path to Bandit baseline file (optional)"
        required: false
        default: ""
        type: string
      upload_sarif:
        description: "Upload SARIF to GitHub code scanning"
        required: false
        default: false
        type: boolean
      run_pip_audit:
        description: "Also run pip-audit on dependencies"
        required: false
        default: true
        type: boolean
      fail_on_findings:
        description: "Fail job if findings exist (Bandit and/or pip-audit)"
        required: false
        default: true
        type: boolean

jobs:
  bandit:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.15"
      SCAN_SEVERITY: ${{ inputs.severity || 'medium' }}
      SCAN_CONFIDENCE: ${{ inputs.confidence || 'medium' }}
      SCAN_BASELINE: ${{ inputs.use_baseline }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          if [ "${{ inputs.upload_sarif }}" = "true" ]; then
            pip install 'bandit[sarif]==1.9.4'
          else
            pip install 'bandit==1.9.4'
          fi
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.run_pip_audit }}" = "true" ]; then pip install 'pip-audit==2.10.1'; fi
          sudo apt-get update -y && sudo apt-get install -y jq

      - name: Determine file set (tracked .py files within your target dirs)
        id: files
        shell: bash
        run: |
          # Use tracked Python files only to avoid vendored/venv noise
          mapfile -t PYFILES < <(git ls-files -- 'pyutils_collection/*.py')
          # Filter to the provided dirs and exclude common junk
          FILTERED=()
          for f in "${PYFILES[@]}"; do
            case "$f" in
              venv/*|.venv/*|.mypy_cache/*|.ruff_cache/*|dist/*|build/*) continue ;;
            esac
            FILTERED+=("$f")
          done
          if [ ${#FILTERED[@]} -eq 0 ]; then
            echo "::error::No package Python files matched the security scan."
            exit 1
          else
            printf '%s\n' "${FILTERED[@]}" > bandit-filelist.txt
            echo "files=bandit-filelist.txt" >> $GITHUB_OUTPUT
          fi

      - name: Run Bandit (JSON)
        id: bandit_json
        shell: bash
        run: |
          set +e
          BASELINE_ARG=()
          if [ -n "$SCAN_BASELINE" ]; then
            if [ ! -f "$SCAN_BASELINE" ]; then exit 2; fi
            BASELINE_ARG=(--baseline "$SCAN_BASELINE")
          fi
          mapfile -t SCAN_FILES < "${{ steps.files.outputs.files }}"

          bandit \
            --severity-level "$SCAN_SEVERITY" \
            --confidence-level "$SCAN_CONFIDENCE" \
            -f json -o bandit.json \
            "${SCAN_FILES[@]}" \
            "${BASELINE_ARG[@]}"
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          set -e
        continue-on-error: true

      - name: Convert/Export SARIF (if requested)
        if: ${{ inputs.upload_sarif }}
        id: bandit_sarif
        shell: bash
        run: |
          set +e
          # Newer Bandit supports SARIF directly; try it first.
          if [ -n "${{ steps.files.outputs.files }}" ]; then
            BASELINE_ARG=()
            if [ -n "$SCAN_BASELINE" ]; then
              if [ ! -f "$SCAN_BASELINE" ]; then exit 2; fi
              BASELINE_ARG=(--baseline "$SCAN_BASELINE")
            fi
            mapfile -t SCAN_FILES < "${{ steps.files.outputs.files }}"
            bandit \
              --severity-level "$SCAN_SEVERITY" \
              --confidence-level "$SCAN_CONFIDENCE" \
              -f sarif -o bandit.sarif \
              "${SCAN_FILES[@]}" \
              "${BASELINE_ARG[@]}"
          else
            exit 2
          fi
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          set -e
        continue-on-error: true

      - name: Ensure SARIF file exists
        if: ${{ inputs.upload_sarif }}
        run: |
          if [ ! -f bandit.sarif ]; then
            echo "::error::Bandit did not produce a SARIF report."
            exit 1
          fi

      - name: pip-audit (dependency CVEs) — optional
        if: github.event_name == 'pull_request' || inputs.run_pip_audit
        id: pip_audit
        shell: bash
        run: |
          set +e
          # Try common requirements files; fall back to current env
          FILES=()
          for f in requirements.txt requirements-dev.txt requirements_dev.txt requirements/*.txt; do
            [ -f "$f" ] && FILES+=(-r "$f")
          done
          if [ ${#FILES[@]} -gt 0 ]; then
            pip-audit "${FILES[@]}" -f json -o pip-audit.json
          else
            pip-audit -f json -o pip-audit.json
          fi
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          set -e
        continue-on-error: true

      - name: Validate scan reports
        env:
          AUDIT_ENABLED: ${{ github.event_name == 'pull_request' || inputs.run_pip_audit }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("bandit.json").read_text())
          if report.get("errors") or len(report.get("metrics", {})) <= 1:
              raise SystemExit("Bandit reported scan errors or scanned no files")
          if os.environ.get("AUDIT_ENABLED") == "true":
              audit = json.loads(Path("pip-audit.json").read_text())
              if not isinstance(audit.get("dependencies"), list):
                  raise SystemExit("pip-audit did not produce a valid dependency report")
          PY

      - name: Summarize findings
        id: summary
        shell: bash
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f bandit.json ]; then
            SEV_H=$(jq '.metrics._totals["SEVERITY.HIGH"] // 0' bandit.json)
            SEV_M=$(jq '.metrics._totals["SEVERITY.MEDIUM"] // 0' bandit.json)
            SEV_L=$(jq '.metrics._totals["SEVERITY.LOW"] // 0' bandit.json)
            echo "### Bandit" >> $GITHUB_STEP_SUMMARY
            echo "- High: **$SEV_H**" >> $GITHUB_STEP_SUMMARY
            echo "- Medium: **$SEV_M**" >> $GITHUB_STEP_SUMMARY
            echo "- Low: **$SEV_L**" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Bandit" >> $GITHUB_STEP_SUMMARY
            echo "- No report produced" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f pip-audit.json ]; then
            VULN_COUNT=$(jq '[.dependencies[]?.vulns[]?] | length' pip-audit.json)
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### pip-audit" >> $GITHUB_STEP_SUMMARY
            echo "- Vulnerabilities: **$VULN_COUNT**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit.json
            bandit.sarif
            pip-audit.json
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub code scanning
        if: ${{ inputs.upload_sarif }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif

      - name: Decide final status
        if: always()
        shell: bash
        run: |
          FAIL=0
          CODES=("${{ steps.bandit_json.outputs.exit_code }}")
          if [ "${{ inputs.upload_sarif }}" = "true" ]; then CODES+=("${{ steps.bandit_sarif.outputs.exit_code }}"); fi
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.run_pip_audit }}" = "true" ]; then CODES+=("${{ steps.pip_audit.outputs.exit_code }}"); fi
          for code in "${CODES[@]}"; do
            case "$code" in
              0) ;;
              1) FAIL=1 ;;
              *) echo "::error::Security check did not complete successfully (status: $code)."; exit 1 ;;
            esac
          done

          if [ "$FAIL" -ne 0 ] && { [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.fail_on_findings }}" = "true" ]; }; then
            echo "Failing due to findings or tool errors (per configuration)."
            exit 1
          else
            if [ "$FAIL" -ne 0 ]; then
              echo "Findings recorded in report-only mode."
            else
              echo "Security checks completed without findings."
            fi
          fi
