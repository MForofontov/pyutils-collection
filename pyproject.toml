[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyutils-collection"
dynamic = ["version"]
description = "Python utilities: 500+ type-annotated functions across 31 modules for async operations, data processing, file handling, security, and more"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.15"
authors = [
    { name = "Mykyta Forofontov" }
]
keywords = [
    "utilities",
    "utils",
    "helpers",
    "asyncio",
    "database",
    "file-handling",
    "data-validation",
    "compression",
    "datetime",
    "decorators",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]

dependencies = [
    "cramjam==2.14.0",
    "python-snappy==0.7.3",
    "psutil==7.2.2",
    "tqdm==4.70.1",
    "numpy==2.5.4",
    "matplotlib==3.11.2",
    "aiohttp==3.14.5",
    "pytz==2026.5",
    "sqlalchemy==2.1.6",
    "toml==0.10.2",
    "pyyaml==6.0.3",
    "pydantic==2.14.1",
    "cerberus==1.3.8",
    "bcrypt==5.0.0",
    "cryptography==50.0.2",
    "PyJWT==2.15.1",
    "dnspython==2.9.0",
    "requests==2.34.2",
    "paramiko==5.1.0",
    "beautifulsoup4==4.15.0",
    "soupsieve==4.0.1",
    "lxml==6.1.3",
    "openpyxl==3.1.5",
    "pyarrow==26.0.0",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
]

[project.urls]
Homepage = "https://github.com/MForofontov/pyutils-collection"
Repository = "https://github.com/MForofontov/pyutils-collection"
Issues = "https://github.com/MForofontov/pyutils-collection/issues"
Documentation = "https://github.com/MForofontov/pyutils-collection#readme"
"Author Profile" = "https://github.com/MForofontov"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "pytest-cov==7.1.0",
    "allure-pytest==2.16.2",
    "allure-python-commons==2.16.2",
    "mypy==2.4.0",
    "ruff==0.17.3",
    "pylint==4.1.3",
    "pytest-xdist==3.8.0",
    "bandit==1.9.4",
    "build==1.6.1",
    "twine==7.0.0",
    "pip-audit==2.10.1",
    "attrs==26.1.0",
    "iniconfig==2.3.1",
    "packaging==26.3",
    "pluggy==1.7.0",
]
playwright = [
    "playwright==1.64.1",
]

[tool.setuptools]
packages = { find = { where = ["."], include = ["pyutils_collection", "pyutils_collection.*"] } }

[tool.setuptools.package-data]
pyutils_collection = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "pyutils_collection._version.__version__"}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["pytest/unit"]
# optional, if you use asyncio tests
# asyncio_mode = "auto"
markers = [
    "integration: isolated local-service integration checks, run explicitly",
    "unit: marks tests as unit tests (deselect with '-m \"not unit\"')",
    "performance: marks tests as performance tests (deselect with '-m \"not performance\"')",
    "slow: marks tests as slow running tests (deselect with '-m \"not slow\"')",
    # Module-based markers for selective test execution
    "asyncio_functions: tests for asyncio utilities",
    "batch_processing: tests for batch processing functions",
    "cli_functions: tests for CLI and system utilities",
    "compression: tests for compression functions",
    "data_validation: tests for data validation functions",
    "data_visualization: tests for data visualization functions",
    "database: tests for database functions",
    "datetime: tests for datetime utilities",
    "decorators: tests for function decorators",
    "dev_utilities: tests for development utilities",
    "env_config: tests for environment configuration",
    "file_functions: tests for file operations",
    "formatting: tests for formatting functions",
    "http_functions: tests for HTTP utilities",
    "iterable_functions: tests for iterable operations",
    "json_functions: tests for JSON utilities",
    "logger_functions: tests for logging utilities",
    "machine_learning: tests for machine learning functions",
    "mathematical_functions: tests for mathematical operations",
    "multiprocessing_functions: tests for parallel processing",
    "network_functions: tests for network utilities",
    "regex: tests for regex functions",
    "scientific_computing: tests for scientific computing functions",
    "security: tests for security and cryptography functions",
    "serialization: tests for data serialization (parquet, excel, etc.)",
    "ssh_functions: tests for SSH operations",
    "strings_utility: tests for string manipulation",
    "testing: tests for testing utilities",
    "url_functions: tests for URL utilities",
    "web_scraping: tests for web scraping utilities",
    "playwright_functions: tests for optional browser automation utilities",
]

[tool.ruff]
line-length = 88
target-version = "py315"  # match lowest supported Python
extend-exclude = ["venv", ".venv", "dist", "build", ".mypy_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]
ignore = [
  "E501",  # formatter handles long lines
  "UP046",  # Preserve existing runtime TypeVar-based generic class interfaces.
  "UP047",  # Preserve existing runtime TypeVar-based generic function interfaces.
]

[tool.ruff.lint.isort]
known-first-party = ["pyutils_collection"]

[tool.ruff.format]
# Ruff is the formatter

[tool.mypy]
python_version = "3.15"               # match lowest supported
strict = true
explicit_package_bases = true
ignore_missing_imports = true         # relax until stubs are added
warn_unused_ignores = true
no_implicit_optional = true
pretty = true
cache_dir = ".mypy_cache"

[tool.coverage.run]
source = ["pyutils_collection"]
omit = [
    "*/tests/*",
    "*/pytest/*",
    "*/pytest_run_tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "*/.venv_new/*",
    "*/build/*",
    "*/dist/*",
    "*/.eggs/*",
    "*.egg-info/*",
    "find_missing_tests.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
